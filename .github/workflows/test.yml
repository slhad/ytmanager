name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create mock credentials file
        run: |
          echo '{
            "installed": {
              "client_id": "test-client-id-for-ci",
              "client_secret": "test-client-secret-for-ci",
              "redirect_uris": ["http://localhost:3000/callback"]
            }
          }' > creds.json

      - name: Run tests
        run: bun test
